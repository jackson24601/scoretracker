<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Classroom Scoreboard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app">
      <header class="top-bar">
        <div class="brand">
          <h1>Classroom Scoreboard</h1>
          <p>Pick teams, then keep a running score.</p>
        </div>

        <div class="controls">
          <div class="control-group" role="group" aria-label="Number of teams">
            <span class="control-label">Teams</span>
            <div class="team-count" id="team-count"></div>
          </div>

          <button type="button" class="ghost-btn" id="reset-btn">
            Reset scores
          </button>
          <button type="button" class="ghost-btn" id="fullscreen-btn">
            Full screen
          </button>
        </div>
      </header>

      <main class="board" id="board" aria-live="polite"></main>
    </div>

    <script src="app.js"></script>
  </body>
</html>
